exporters:
  # We use HTTP rather than gRPC so we can send this out via our HTTP proxy
  otlp_http:
    endpoint: https://${env:COLLECTOR_AUTH_USER}:${env:COLLECTOR_AUTH_TOKEN}@${env:COLLECTOR_GATEWAY_ENDPOINT:-collector.opensafely.org:443}
  debug:
    verbosity: basic

receivers:
  # See docs at:
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/hostmetricsreceiver/README.md
  host_metrics:
    collection_interval: 30s
    scrapers:
      disk:
      load:
      network:
      paging:
      processes:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      filesystem:
        # We want to track the usage of all "standard" disks without having to list them
        # explicitly (which will vary across backends) so instead we exclude the
        # non-standard ones
        exclude_fs_types:
          fs_types:
            - proc
            - sysfs
            - tmpfs
            - devtmpfs
            - devpts
            - cgroup
            - cgroup2
            - overlay
            - squashfs
            - nsfs
          match_type: strict
        metrics:
          system.filesystem.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true

  otlp/localhost:
    protocols:
      http:
        endpoint: localhost:4318

  otlp/docker:
    protocols:
      http:
        endpoint: "${env:DOCKER_BRIDGE_IP:-172.17.0.1}:4318"

processors:
  resource_detection:
    detectors: [env, system]

  batch:
    send_batch_size: 8192
    timeout: 200ms

service:
  pipelines:
    metrics:
      receivers: [host_metrics]
      processors: [resource_detection, batch]
      exporters: [otlp_http, debug]

    traces:
      receivers: [otlp/localhost, otlp/docker]
      processors: [resource_detection, batch]
      exporters: [otlp_http, debug]
